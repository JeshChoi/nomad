services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: nomad
      POSTGRES_DB: nomad
    ports:
      - "5432:5432"
    volumes:
      - nomad_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomad"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nomad_data:
